<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Weekly Brief</title>
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fbfbfc;
      color: #17191f;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.12;
    }
    .muted {
      color: #677083;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 28px 0;
    }
    .card {
      border: 1px solid #e0e4ea;
      border-radius: 8px;
      padding: 16px;
      background: white;
    }
    .value {
      font-size: 28px;
      font-weight: 750;
    }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="muted">Generated by an agent</p>
    <h1>AI Weekly Brief</h1>
    <p class="muted">这是一个由 Agent 生成并发布的交互式 HTML artifact 示例。</p>
    <section class="grid">
      <div class="card"><div class="value">128</div><div class="muted">mentions</div></div>
      <div class="card"><div class="value">34%</div><div class="muted">growth</div></div>
      <div class="card"><div class="value">9</div><div class="muted">sources</div></div>
    </section>
    <p>生产版可以把这个页面上传到 OSS/COS，再通过独立运行域名和 iframe sandbox 展示。</p>
  </main>
</body>
</html>
